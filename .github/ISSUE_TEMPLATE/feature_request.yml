name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem do you want to solve?
      placeholder: Explain why this feature would be useful.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Describe your idea or implementation approach.
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes public API
        - label: Requires new tests
        - label: Affects documentation
