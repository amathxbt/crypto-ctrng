[package]
name = "crypto-ctrng"
version = "0.1.0"
edition = "2024"

[dependencies]
rand_core = { version = "0.6", features = ["std"] }
rand_chacha = "0.3"
sha2 = "0.10"
zeroize = "1.8"
thiserror = "1"
getrandom = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
