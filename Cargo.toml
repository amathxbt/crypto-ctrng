[package]
name = "crypto-ctrng"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Secure abstraction layer over a cosmic True Random Number Generator (cTRNG) backend, exposing RngCore/CryptoRng traits"
license = "MIT"
repository = "https://github.com/spacecomputer-io/crypto-ctrng"
homepage = "https://docs.spacecomputer.io"
keywords = ["cryptography", "random", "trng", "entropy", "rng"]
categories = ["cryptography"]

[dependencies]
rand_core = { version = "0.6", features = ["std"] }
rand_chacha = "0.3"
sha2 = "0.10"
zeroize = "1.8"
thiserror = "1"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[features]
default = []
testu01 = []
practrand = []

[dev-dependencies]
statistical-verification = { git = "https://github.com/spacecomputer-io/statistical-verification.git" }
